<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Javascript</title>
	
</head>
<body style="background-color:peachpuff;">
	<h1>👉Javascript!👈</h1>

	<div style="background-color:pink">
		<h1> Pop-up sporočilo </h1>
		<p>Klikni spodnji gumb in poglej, kaj se bo zgodilo. </p>
		<button onclick ="kokliknemgumb();">Klikni me</button>
	</div>

	<div style="background-color:lightgreen">
		<h1 id="Pozdrav">Funkcija za spremembo besedila </h1>
		<button onclick="prikazbesedila ();">Klikni za pozdrav</button>
	</div>

	<div style="background-color:lightblue">
		<h1 id="napis_za_čas"> Koliko je ura? </h1>
		<button onclick="čas();">Koliko je ura?</button>
	</div>

	<div style="background-color: lightgray">
		<h1>Prikaži novo besedilo</h1>
		<h1 id="novobesedilo" style="font-size:15px; color:brown"></h1>
		<button onclick ="novobesedilo();">Klikni za prikaz novega besedila</button>
	</div>

	<!-- SCRIPT NAPIŠI NA KONEC BODY-JA! -->
	<script type="text/javascript" src="Prva_ura_javascript.js"></script>
	<!-- SCRIPT NAPIŠI NA KONEC BODY-JA! -->
	
</body>
</html>
